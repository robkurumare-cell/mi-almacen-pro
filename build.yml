name: Build APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Unzip Project
      run: |
        unzip MiAlmacenVentasGastos_Android_Source.zip -d .
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Build with Gradle
      run: |
        cd MiAlmacenVentasGastos_Android_Source
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MiAlmacen-APK
        path: MiAlmacenVentasGastos_Android_Source/app/build/outputs/apk/debug/app-debug.apk
